name: smoke

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      gui_pin_corrupt:
        description: 'Corrupt gui-dist.sha256 (negative-pin test; build should fail)'
        type: boolean
        default: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Optionally corrupt the GUI pin
        if: ${{ github.event.inputs.gui_pin_corrupt == 'true' }}
        run: |
          # Flip the first hex character so SHA-256 verification fails.
          sed -i 's/^./0/' gui-dist.sha256
          cat gui-dist.sha256

      - name: Build the wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Install in fresh venv
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/bsky_saves-*-py3-none-any.whl

      - name: Smoke normalise_record subject_status (installed wheel)
        run: |
          /tmp/smoke/bin/python - <<'EOF'
          from bsky_saves.normalize import normalise_record
          raw = {
              "createdAt": "2026-04-12T00:00:00Z",
              "subject": {"uri": "at://x/p/dead"},
              "item": {
                  "$type": "app.bsky.feed.defs#notFoundPost",
                  "uri": "at://x/p/dead",
                  "notFound": True,
              },
          }
          entry = normalise_record(raw)
          assert entry["subject_status"] == "not_found", entry
          print("subject_status wiring OK:", entry["subject_status"])
          EOF

      - name: Start daemon
        run: |
          /tmp/smoke/bin/bsky-saves serve --gui --port 47826 &
          echo $! > /tmp/smoke-pid
          sleep 1

      - name: Smoke / endpoint
        run: |
          curl -fsS http://127.0.0.1:47826/ | grep -q '<title>'

      - name: Smoke /ping endpoint
        run: |
          PINNED=$(awk -F\" '/^gui_version/{print $2}' pyproject.toml)
          export PINNED
          curl -fsS http://127.0.0.1:47826/ping | python3 -c '
          import os, sys, json
          d = json.loads(sys.stdin.read())
          assert d["name"] == "bsky-saves", d
          assert d["protocol"] == "1", d
          expected = os.environ["PINNED"]
          assert d["gui_bundled"] == expected, (d["gui_bundled"], expected)
          '

      - name: Smoke /assets/* endpoint
        run: |
          ASSET_DIR="/tmp/smoke/lib/python3.11/site-packages/bsky_saves/_gui/assets"
          ASSET=$(ls "$ASSET_DIR" | head -1)
          echo "Testing /assets/$ASSET"
          curl -fsS "http://127.0.0.1:47826/assets/$ASSET" > /dev/null

      - name: Smoke /fetch-image rejection
        run: |
          STATUS=$(curl -sS -o /dev/null -w "%{http_code}" -X POST \
              http://127.0.0.1:47826/fetch-image \
              -H 'Content-Type: application/json' \
              -H "Origin: http://127.0.0.1:47826" \
              -d '{"url":"https://evil.com/x.png"}')
          test "$STATUS" = "400" || { echo "expected 400, got $STATUS"; exit 1; }

      - name: Kill daemon
        if: always()
        run: kill "$(cat /tmp/smoke-pid)" || true
