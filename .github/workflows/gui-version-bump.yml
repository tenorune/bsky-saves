name: gui-version-bump

# Listens for the dispatch from bsky-saves-gui's release.yml on every
# new GUI tag. Re-verifies the tarball SHA-256 against the payload,
# updates the GUI version pin + sha256 file, and opens a PR. Never
# auto-merged — the tarball SHA pin is what protects the wheel from a
# tampered GUI build, so the bump goes through human review.
#
# Payload (see bsky-saves-gui docs/bsky-saves-gui-dist-workstream.md
# §2 "Pin-bump flow"):
#   client_payload.version:     "0.7.0"        (no leading v)
#   client_payload.sha256:      "<64 hex>"
#   client_payload.tarball_url: "https://github.com/tenorune/bsky-saves-gui/releases/download/vX.Y.Z/dist.tar.gz"
#   client_payload.ref_name:    "v0.7.0"       (tag with leading v)
#
# The PR is opened with the BSKY_SAVES_GUI_BUMP_PR_TOKEN PAT so that
# verify.yml / smoke.yml fire on it (GITHUB_TOKEN-authored PRs don't
# trigger downstream workflows). If the secret isn't set, the workflow
# still validates and verifies the tarball but skips PR creation with a
# ::warning:: annotation — so this side can be wired in independently.

on:
  repository_dispatch:
    types: [gui-version-bump]

permissions:
  contents: read

jobs:
  open-bump-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate payload shape
        env:
          VERSION: ${{ github.event.client_payload.version }}
          SHA: ${{ github.event.client_payload.sha256 }}
          TARBALL_URL: ${{ github.event.client_payload.tarball_url }}
        run: |
          set -euo pipefail
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
            echo "FAIL: invalid version: $VERSION"; exit 1
          fi
          if ! [[ "$SHA" =~ ^[0-9a-f]{64}$ ]]; then
            echo "FAIL: invalid sha256: $SHA"; exit 1
          fi
          # Defense-in-depth: only accept tarball URLs from the GUI repo's
          # GitHub releases. The dispatch token is the actual trust
          # anchor, but a misconfigured token shouldn't be able to ship a
          # tarball from arbitrary origins.
          if ! [[ "$TARBALL_URL" =~ ^https://github\.com/tenorune/bsky-saves-gui/releases/download/v[0-9]+\.[0-9]+\.[0-9]+/dist\.tar\.gz$ ]]; then
            echo "FAIL: untrusted tarball_url: $TARBALL_URL"; exit 1
          fi

      - name: Verify tarball SHA-256
        env:
          SHA: ${{ github.event.client_payload.sha256 }}
          TARBALL_URL: ${{ github.event.client_payload.tarball_url }}
        run: |
          set -euo pipefail
          curl -sSfL "$TARBALL_URL" -o /tmp/dist.tar.gz
          actual=$(sha256sum /tmp/dist.tar.gz | awk '{print $1}')
          if [ "$actual" != "$SHA" ]; then
            echo "FAIL: tarball SHA mismatch"
            echo "  expected: $SHA"
            echo "  actual:   $actual"
            exit 1
          fi
          echo "OK: tarball SHA matches payload."

      - name: Apply bump
        env:
          VERSION: ${{ github.event.client_payload.version }}
          SHA: ${{ github.event.client_payload.sha256 }}
        run: |
          set -euo pipefail
          # pyproject.toml: `gui_version = "x.y.z"` under [tool.bsky-saves]
          # gui-dist.sha256: sha256sum-format file at repo root
          if ! grep -qE '^gui[_-]version\s*=' pyproject.toml; then
            echo "FAIL: gui-version line not found in pyproject.toml"
            echo "Update the 'Apply bump' step in this workflow."
            exit 1
          fi
          sed -i -E "s/^(gui[_-]version\s*=\s*).*/\1\"${VERSION}\"/" pyproject.toml
          echo "${SHA}  dist.tar.gz" > gui-dist.sha256

      - name: Check PR-open token
        id: pat
        env:
          PAT: ${{ secrets.BSKY_SAVES_GUI_BUMP_PR_TOKEN }}
        run: |
          if [ -z "$PAT" ]; then
            echo "::warning::BSKY_SAVES_GUI_BUMP_PR_TOKEN is not set; skipping PR creation. The tarball was verified and the bump would be mechanically valid — set the secret to enable auto-PRs."
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update bump PR
        if: steps.pat.outputs.available == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.BSKY_SAVES_GUI_BUMP_PR_TOKEN }}
          branch: gui-bump/v${{ github.event.client_payload.version }}
          base: main
          delete-branch: true
          commit-message: |
            build(gui): bump bundled GUI pin to v${{ github.event.client_payload.version }}

            Tarball: ${{ github.event.client_payload.tarball_url }}
            SHA-256: ${{ github.event.client_payload.sha256 }}
          title: "build(gui): bump bundled GUI pin to v${{ github.event.client_payload.version }}"
          body: |
            Auto-generated by `gui-version-bump` in response to a
            `repository_dispatch` from `bsky-saves-gui`.

            **Release:** [${{ github.event.client_payload.ref_name }}](https://github.com/tenorune/bsky-saves-gui/releases/tag/${{ github.event.client_payload.ref_name }})
            **Tarball:** ${{ github.event.client_payload.tarball_url }}
            **SHA-256:** `${{ github.event.client_payload.sha256 }}`

            The workflow already re-verified the tarball SHA against the
            payload. Review the GUI release notes before merging.
          add-paths: |
            pyproject.toml
            gui-dist.sha256
