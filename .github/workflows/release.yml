name: release

# Fires on tag push of the form vX.Y.Z. The Actions tab will show one run
# per tag pushed. Pushes to main do NOT trigger this — only tags do.
on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest

    # Runs in the "pypi" GitHub Environment. The name must match the
    # Environment field on PyPI's trusted-publisher page (configured once
    # at https://pypi.org/manage/account/publishing/).
    environment: pypi

    # Required for PyPI trusted publishing: GitHub mints a short-lived OIDC
    # token that PyPI verifies against the trusted-publisher claims, then
    # issues a one-shot upload token. No long-lived API tokens.
    permissions:
      id-token: write

    # Surfaced to the dispatch-bump job below so it can fire a
    # wheel-version-bump repository_dispatch at tenorune/bsky-saves-install
    # (the installer repo) with the exact wheel metadata.
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      sha256: ${{ steps.metadata.outputs.sha256 }}
      wheel_url: ${{ steps.wheel_url.outputs.wheel_url }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build sdist + wheel
        run: |
          pip install build
          python -m build

      - name: Compute wheel metadata
        id: metadata
        run: |
          set -euo pipefail
          REF_NAME='${{ github.ref_name }}'
          TAG_VERSION="${REF_NAME#v}"
          WHEEL_FILE=$(ls dist/bsky_saves-*-py3-none-any.whl)
          SHA=$(sha256sum "$WHEEL_FILE" | awk '{print $1}')
          # Guardrail: the wheel's embedded version must match the tag (after
          # PEP 440 normalization, since v0.6.7-rc1 -> 0.6.7rc1). Catches the
          # "forgot to bump pyproject.toml before tagging" footgun before we
          # publish to a permanently-consumed PyPI version slot. packaging is
          # already installed transitively via `build` in the prior step.
          WHEEL_VERSION=$(basename "$WHEEL_FILE" | sed -E 's/^bsky_saves-([^-]+)-py3-none-any\.whl$/\1/')
          VERSION=$(python3 -c "from packaging.version import Version; print(Version('$TAG_VERSION'))")
          if [ "$WHEEL_VERSION" != "$VERSION" ]; then
            echo "::error::Tag version ($VERSION) does not match wheel version ($WHEEL_VERSION)."
            echo "Did you forget to bump pyproject.toml before tagging $REF_NAME?"
            exit 1
          fi
          echo "OK: wheel version ($WHEEL_VERSION) matches normalized tag ($VERSION)."
          # The 'version' output is the PEP 440-normalized form; downstream
          # steps poll PyPI and dispatch to the installer with this canonical
          # value, so a hyphenated tag (v0.6.7-rc1) still resolves correctly.
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "Wheel: $WHEEL_FILE"
          echo "Version: $VERSION (normalized from tag $REF_NAME)"
          echo "SHA-256: $SHA"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Resolve wheel URL on PyPI
        id: wheel_url
        run: |
          set -euo pipefail
          VERSION='${{ steps.metadata.outputs.version }}'
          # Poll PyPI's JSON API until the new version is indexed. There's
          # typically a brief delay (seconds) between upload-accept and the
          # JSON API reflecting it; retry up to ~120s. curl uses -L so a
          # PyPI-side redirect (e.g. version-URL canonicalization) doesn't
          # register as a silent failure.
          URL=""
          for i in $(seq 1 24); do
            if RESOLVED=$(curl -fsSL "https://pypi.org/pypi/bsky-saves/${VERSION}/json" 2>/dev/null | python3 -c "
          import sys, json
          try:
              d = json.load(sys.stdin)
          except Exception:
              sys.exit(1)
          for f in d.get('urls', []):
              if f.get('packagetype') == 'bdist_wheel':
                  print(f['url'])
                  sys.exit(0)
          sys.exit(1)
          " 2>/dev/null) && [ -n "$RESOLVED" ]; then
              URL="$RESOLVED"
              break
            fi
            echo "PyPI not yet reflecting bsky-saves==${VERSION}, retrying in 5s..."
            sleep 5
          done
          if [ -z "$URL" ]; then
            echo "::error::Could not resolve wheel URL for bsky-saves==${VERSION} on PyPI after 120s"
            exit 1
          fi
          echo "wheel_url=$URL" >> "$GITHUB_OUTPUT"
          echo "Resolved URL: $URL"

  # After publish succeeds, fire a repository_dispatch at
  # tenorune/bsky-saves-install so its wheel-version-bump.yml can open an
  # auto-PR bumping the installer's wheel pin + sha256 to the new release.
  # Mirrors the bsky-saves-gui → bsky-saves gui-version-bump pattern,
  # outbound this time. Skips with ::warning:: if the dispatch PAT isn't
  # set, so this side can be wired in independently of the installer side.
  dispatch-bump:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check dispatch token
        id: pat
        env:
          PAT: ${{ secrets.BSKY_SAVES_INSTALL_DISPATCH_TOKEN }}
        run: |
          if [ -z "$PAT" ]; then
            echo "::warning::BSKY_SAVES_INSTALL_DISPATCH_TOKEN not set; skipping wheel-version-bump dispatch to bsky-saves-install. Set the secret to enable auto-bump PRs on the installer side."
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch wheel-version-bump to bsky-saves-install
        if: steps.pat.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ secrets.BSKY_SAVES_INSTALL_DISPATCH_TOKEN }}
          VERSION: ${{ needs.publish.outputs.version }}
          SHA: ${{ needs.publish.outputs.sha256 }}
          WHEEL_URL: ${{ needs.publish.outputs.wheel_url }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh api repos/tenorune/bsky-saves-install/dispatches \
            -X POST \
            -f event_type='wheel-version-bump' \
            -f "client_payload[version]=${VERSION}" \
            -f "client_payload[sha256]=${SHA}" \
            -f "client_payload[wheel_url]=${WHEEL_URL}" \
            -f "client_payload[ref_name]=${REF_NAME}"
          echo "Dispatched wheel-version-bump for ${REF_NAME} to bsky-saves-install."
