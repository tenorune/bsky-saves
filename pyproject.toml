[build-system]
requires = ["hatchling", "tomli; python_version < '3.11'"]
build-backend = "hatchling.build"

[project]
name = "bsky-saves"
version = "0.7.0"
description = "BlueSky bookmarks ingestion toolkit: fetch, hydrate (article text, self-thread context, images), and merge into a JSON inventory."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "tenorune" }]
keywords = ["bluesky", "atproto", "bookmarks", "ingestion"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet",
]
dependencies = [
  "httpx>=0.27",
  "trafilatura>=2.0.0",
  # justext (a trafilatura dependency) imports lxml.html.clean, which lxml
  # >=5.2 split into a separately-packaged project; neither justext nor
  # trafilatura declares it, so a fresh install otherwise breaks at
  # `import trafilatura`. Backstop it here to keep `pip install bsky-saves`
  # working.
  "lxml-html-clean",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "respx>=0.21",
]

[project.urls]
Homepage = "https://github.com/tenorune/bsky-saves"
Issues = "https://github.com/tenorune/bsky-saves/issues"

[project.scripts]
bsky-saves = "bsky_saves.cli:main"

[tool.bsky-saves]
# Pinned bsky-saves-gui release. Scripts/fetch_gui.py downloads
# dist.tar.gz from https://github.com/tenorune/bsky-saves-gui/releases/
# download/v{gui_version}/dist.tar.gz and verifies it against gui-dist.sha256.
# Bumping this requires updating gui-dist.sha256 from the same release.
gui_version = "0.6.0"

[tool.hatch.build]
# _gui/ is gitignored (vendored at build time); explicitly include it in the wheel.
artifacts = ["src/bsky_saves/_gui/**"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["src/bsky_saves"]
